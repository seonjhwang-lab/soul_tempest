<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#060913" />
<meta name="description" content="SOUL TEMPEST : LEGEND OF THE HUNTER — 다크 소울 · 몬스터 헌터 · 젤다 · 바람의 나라의 손맛을 담은 픽셀 수렵 액션 RPG" />
<title>SOUL TEMPEST : Legend of the Hunter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="360" height="640"></canvas>
    <!-- 360×640 논리 상자(무대 크기에 맞춰 통째로 확대/축소) -->
    <div id="ui">

      <!-- HUD: 왼쪽 위 무기·마법 칸 + HP/MP/SP, 그 아래 골드·에스트 / 오른쪽 위 📜 / 위 가운데 보스 바 · 한 줄 리본 -->
      <div id="hud">
        <div class="hud-tl">
          <button id="hud-weapon" class="slot" type="button" aria-label="장착 무기"></button>
          <button id="hud-spell" class="slot slot-spell" type="button" aria-label="비전 마법(눌러서 바꾸기)"></button>
          <div id="hud-bars" class="bars">
            <div class="bar bar-hp"><i id="bar-hp"></i><b id="bar-hp-t"></b></div>
            <div class="bar bar-mp"><i id="bar-mp"></i></div>
            <div class="bar bar-sp"><i id="bar-sp"></i></div>
          </div>
        </div>
        <div class="hud-row2"><span id="hud-gold" class="hud-chip"></span><span id="hud-estus" class="hud-chip"></span></div>
        <button id="btn-status" class="status-btn" type="button" aria-label="장비·도감 (Tab)"><i class="pxi" data-ic="scroll">📜</i><span>장비·도감</span></button>
        <div id="boss-bar" hidden>
          <div id="bb-name" class="bb-name"></div>
          <div class="bb-hp"><i id="bb-hp"></i></div>
          <div class="bb-part"><span id="bb-pic" class="bb-pic"></span><div class="bb-pbar"><i id="bb-pt"></i></div></div>
        </div>
        <div id="ribbon" hidden></div>
      </div>

      <!-- 조작(v81): 왼쪽 절반 어디든 가상 조이스틱 / 실제 화면 오른쪽 아래 모서리에 밀착한 아크 버튼 4개(양손 엄지 자리) -->
      <div id="ctl">
        <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
        <div id="act-pad" class="act-pad">
        <button id="btn-act" class="act-btn" data-pad="X" type="button" aria-label="공격 (꾹 누르면 모아베기)"><span id="act-ic" class="act-ic"><i class="pxb" data-ic="btn_attack">⚔</i></span><span id="act-lab" class="act-lab"></span></button>
        <button id="btn-roll" class="arc-btn btn-roll" data-pad="Y" type="button" aria-label="구르기 회피"><i class="pxb" data-ic="btn_dash">🪽</i></button>
        <button id="btn-magic" class="arc-btn btn-magic" data-pad="B" type="button" aria-label="비전 마법"><i class="rbb" data-ic="btn_magic">✨</i><b id="magic-cost" class="btn-badge"></b><span id="magic-cd" class="btn-cd" hidden><b id="magic-cd-t"></b></span></button>
        <button id="btn-estus" class="arc-btn btn-estus" data-pad="LB" type="button" aria-label="에스트 물약"><i class="rbb" data-ic="btn_estus">🧪</i><b id="estus-n" class="btn-badge"></b></button>
        </div>
      </div>

      <!-- 사냥꾼의 대장간: 위 무기 계보 카드 / 가운데 설명 · 작업대(캔버스, 직접 누르기) / 아래 버튼 -->
      <div id="forge-ui" hidden>
        <div class="fg-head"><span class="fg-title">🔨 사냥꾼의 대장간</span><span id="fg-gold" class="fg-gold"></span><button id="fg-close" class="fg-x" type="button" aria-label="나가기 (Esc)">✖</button></div>
        <div id="fg-tree" class="fg-tree"></div>
        <div id="fg-detail" class="fg-detail"></div>
        <div id="fg-hit" class="fg-hit"></div>
        <div id="fg-actions" class="fg-actions"></div>
      </div>

      <!-- 📜 장비 · 소재 · 무기 도감 -->
      <div id="status-ui" class="modal" hidden role="dialog" aria-label="장비·도감">
        <div class="md-box">
          <div class="md-head"><button class="st-tab is-on" data-tab="gear" type="button">⚔️ 장비</button><button class="st-tab" data-tab="mats" type="button">🎒 소재</button><button class="st-tab" data-tab="codex" type="button">📖 무기 도감</button><button id="st-close" class="md-x" type="button" aria-label="닫기">✖</button></div>
          <div id="st-body" class="md-body"></div>
        </div>
      </div>

      <!-- v79 화톳불 전송(Fast Travel): 쉬고 나면 다른 화톳불로 순간이동 -->
      <div id="warp-ui" class="modal modal-warp" hidden role="dialog" aria-label="화톳불 전송">
        <div class="wp-box"><div class="wp-title">🔥 화톳불 전송 — 영혼의 폭풍을 타고 갈 곳</div><div id="wp-list" class="wp-list"></div><button id="wp-stay" class="wp-stay" type="button">이곳에 머무르기</button></div>
      </div>

      <!-- 고대 비석: 마법 각인 3택 1 -->
      <div id="rune-ui" class="modal" hidden role="dialog" aria-label="고대 마법 각인">
        <div class="rn-box"><div class="rn-title">🗿 고대 비석이 빛난다 — 각인 하나를 새겨라</div><div id="rn-cards" class="rn-cards"></div></div>
      </div>

      <!-- v82 방랑 NPC 대화 바: 화면 아래 가운데의 슬림한 반투명 바(아이콘 · 이름 · 대사 2줄 · [기능 실행] · [닫기]) — 시간은 멈추지 않고, 걸어서 멀어지면 닫힌다 -->
      <div id="talk-ui" class="talk" hidden role="dialog" aria-label="대화">
        <div class="tk-row"><span id="tk-ic" class="tk-ic"></span><div class="tk-text"><b id="tk-name" class="tk-name"></b><p id="tk-l1" class="tk-line"></p><p id="tk-l2" class="tk-line"></p></div></div>
        <div class="tk-acts"><span id="tk-acts" class="tk-fns"></span><button id="tk-close" class="tk-close" type="button">닫기</button></div>
      </div>

      <!-- 타이틀(v78) 『SOUL TEMPEST : LEGEND OF THE HUNTER』: 부서진 폭풍의 고리 엠블럼 · 금빛 장식선 · 세리프 로고 · 부제(시트에서 각각 잘라 낸 그림) ·
           버튼 · 버전(오른쪽 아래). 배경(칠흑의 심연 · 유적 돌바닥 · 안개 · 화톳불과 기사 · 황금 재)은 캔버스 -->
      <div id="title-ui">
        <div class="tt-col">
        <div id="tt-emblem" class="tt-emblem"></div>
        <div id="tt-div1" class="tt-div tt-div1" aria-hidden="true"></div>
        <h1 class="tt-logo"><span class="sr-only">SOUL TEMPEST : LEGEND OF THE HUNTER</span><span id="tt-logo" aria-hidden="true"></span></h1>
        <div id="tt-sub" class="tt-sub" aria-hidden="true"></div>
        <div id="tt-div2" class="tt-div tt-div2" aria-hidden="true"></div>
        <button id="btn-continue" class="tt-btn" type="button" hidden>이어서 하기</button>
        <button id="btn-new" class="tt-btn" type="button">새로 시작</button>
        </div>
        <p id="tt-version" class="tt-version"></p>
      </div>
      <!-- v86 시네마틱(오프닝 · 진 엔딩 크레딧): 그림은 캔버스 — 여기는 스킵만(오른쪽 위 버튼 · 화면 어디든 터치 · ESC) -->
      <div id="cine-ui" hidden><button id="cine-skip" type="button" aria-label="컷씬 건너뛰기 (ESC)">스킵 ⏩</button></div>
    </div>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/sfx.js"></script>
<script src="js/sprites.js"></script>
<script src="js/save.js"></script>
<script src="js/fx.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/combat.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/boss.js"></script>
<script src="js/magic.js"></script>
<script src="js/loot.js"></script>
<script src="js/gimmick.js"></script>
<script src="js/npc.js"></script>
<script src="js/companion.js"></script>
<script src="js/tempest.js"></script>
<script src="js/forge.js"></script>
<script src="js/ui.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
